# Local / staging stack — API + Web + Postgres
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workforce360
      POSTGRES_PASSWORD: workforce360
      POSTGRES_DB: workforce360
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce360"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://workforce360:workforce360@db:5432/workforce360?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: change-me-access-secret-min-32-characters-long
      JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-characters-long
      COOKIE_SECURE: "false"
      APP_PUBLIC_BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      STORAGE_PUBLIC_BASE_URL: http://localhost:4000
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - api

volumes:
  pgdata:
